<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git 练习页面</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e5e7eb;
        background: #0b1120;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 4rem 1.25rem;
        background: radial-gradient(ellipse at top, #172554 0, #0b1120 55%);
        line-height: 1.7;
      }

      header,
      main {
        width: min(100%, 720px);
        margin-inline: auto;
      }

      header {
        margin-bottom: 2rem;
      }

      h1 {
        margin-bottom: 0.5rem;
        color: #f8fafc;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      header p {
        color: #a5b4fc;
      }

      section {
        margin-bottom: 1rem;
        padding: 1.5rem;
        border: 1px solid #293548;
        border-radius: 1rem;
        background: rgb(17 24 39 / 85%);
        box-shadow: 0 12px 32px rgb(0 0 0 / 20%);
      }

      h2 {
        margin-top: 0;
        color: #c4b5fd;
      }

      li::marker {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>我的 Git 练习项目</h1>
      <p>这是一个用来练习 Git 基本操作的小项目。</p>
    </header>

    <main>
      <section>
        <h2>练习目标</h2>
        <ul>
          <li>查看文件状态并暂存更改</li>
          <li>创建提交并查看提交记录</li>
          <li>使用分支尝试修改，再合并更改</li>
        </ul>
      </section>

      <section>
        <h2>今天的记录</h2>
        <p>在这里修改内容，然后用 Git 记录每一次变化。</p>
      </section>
    </main>
  </body>
</html>
