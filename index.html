<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>任务截止时间</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 3rem 1rem;
        background: #f1f5f9;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      header,
      main {
        width: min(100%, 720px);
        margin-inline: auto;
      }

      header {
        margin-bottom: 2rem;
      }

      h1 {
        margin-bottom: 0.25rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
      }

      header p,
      .hint,
      .empty-state {
        color: #64748b;
      }

      .panel {
        margin-bottom: 1.25rem;
        padding: 1.5rem;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 6%);
      }

      h2 {
        margin-top: 0;
        font-size: 1.25rem;
      }

      .task-form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        font-weight: 600;
      }

      input {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.55rem 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgb(59 130 246 / 20%);
        border-color: #3b82f6;
      }

      button {
        justify-self: start;
        margin-top: 0.5rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .task-list {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
      }

      .task-item.is-overdue {
        border-color: #fca5a5;
        background: #fff7f7;
      }

      .task-due-date {
        color: #475569;
        white-space: nowrap;
      }

      .task-deadline {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .overdue-notice {
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid #fecaca;
        border-radius: 0.5rem;
        background: #fef2f2;
        color: #b91c1c;
        font-weight: 600;
      }

      .overdue-badge {
        padding: 0.1rem 0.55rem;
        border-radius: 999px;
        background: #fee2e2;
        color: #b91c1c;
        font-size: 0.85rem;
        font-weight: 700;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>任务截止时间</h1>
      <p>记录待办事项和它们的截止日期。</p>
    </header>

    <main>
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">添加任务</h2>
        <form class="task-form" id="taskForm">
          <label for="taskTitle">任务名称</label>
          <input id="taskTitle" name="taskTitle" type="text" placeholder="例如：完成 Git 练习" required>

          <label for="dueDate">截止日期</label>
          <input id="dueDate" name="dueDate" type="date" required>
          <p class="hint">选择任务需要完成的日期。</p>

          <button id="saveTask" type="submit">保存任务</button>
          <p class="hint" id="saveStatus" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="tasks-title">
        <h2 id="tasks-title">待办任务</h2>
        <p class="overdue-notice" id="overdueNotice" role="status" aria-live="polite" hidden></p>
        <ul class="task-list" id="taskList">
          <li class="empty-state">添加任务后会显示在这里。</li>
        </ul>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "due-date-tasks";
      const taskForm = document.querySelector("#taskForm");
      const taskTitleInput = document.querySelector("#taskTitle");
      const dueDateInput = document.querySelector("#dueDate");
      const taskList = document.querySelector("#taskList");
      const saveStatus = document.querySelector("#saveStatus");
      const overdueNotice = document.querySelector("#overdueNotice");

      function loadTasks() {
        try {
          const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(savedTasks)) return [];

          return savedTasks.filter(
            (task) => task && typeof task.title === "string" && typeof task.dueDate === "string"
          );
        } catch {
          return [];
        }
      }

      let tasks = loadTasks();

      function renderTasks() {
        taskList.replaceChildren();

        const now = new Date();
        const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        const overdueCount = tasks.filter((task) => task.dueDate < today).length;
        overdueNotice.hidden = overdueCount === 0;
        overdueNotice.textContent = overdueCount > 0
          ? `提醒：有 ${overdueCount} 项任务已过期，请及时处理。`
          : "";

        if (tasks.length === 0) {
          const emptyState = document.createElement("li");
          emptyState.className = "empty-state";
          emptyState.textContent = "添加任务后会显示在这里。";
          taskList.append(emptyState);
          return;
        }

        for (const task of tasks) {
          const item = document.createElement("li");
          const isOverdue = task.dueDate < today;
          item.className = isOverdue ? "task-item is-overdue" : "task-item";

          const title = document.createElement("span");
          title.textContent = task.title;

          const dueDate = document.createElement("time");
          dueDate.className = "task-due-date";
          dueDate.dateTime = task.dueDate;
          dueDate.textContent = `截止：${new Date(`${task.dueDate}T00:00:00`).toLocaleDateString("zh-CN")}`;

          const deadline = document.createElement("span");
          deadline.className = "task-deadline";
          deadline.append(dueDate);

          if (isOverdue) {
            const badge = document.createElement("span");
            badge.className = "overdue-badge";
            badge.textContent = "已过期";
            deadline.append(badge);
          }

          item.append(title, deadline);
          taskList.append(item);
        }
      }

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = taskTitleInput.value.trim();
        const dueDate = dueDateInput.value;
        if (!title || !dueDate) return;

        tasks.push({ title, dueDate });

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          saveStatus.textContent = "任务已保存在此浏览器中。";
        } catch {
          saveStatus.textContent = "保存失败，请检查浏览器的本地存储设置。";
        }

        renderTasks();
        taskForm.reset();
        taskTitleInput.focus();
      });

      renderTasks();
    </script>
  </body>
</html>
